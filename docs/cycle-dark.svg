<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" role="img" aria-label="The cycle: Life, Release, Dissolution, Stillness, Rebirth, and back to Life">
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="70%"><stop offset="0" stop-color="#1b1f2c"/><stop offset="1" stop-color="#0b0c12"/></radialGradient>
  <linearGradient id="release" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9a35a"/><stop offset="1" stop-color="#6f9fe0"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#e9a35a" stop-opacity="0.55"/><stop offset="1" stop-color="#e9a35a" stop-opacity="0"/></radialGradient>
  <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8f8678"/></marker>
</defs>
<path d="M473.8,143.0 A190,190 0 0 1 607.4,240.1" fill="none" stroke="#8f8678" stroke-width="1.6" marker-end="url(#head)"/>
<path d="M628.3,304.4 A190,190 0 0 1 577.3,461.4" fill="none" stroke="#8f8678" stroke-width="1.6" marker-end="url(#head)"/>
<path d="M522.5,501.1 A190,190 0 0 1 357.5,501.1" fill="none" stroke="#8f8678" stroke-width="1.6" marker-end="url(#head)"/>
<path d="M302.7,461.4 A190,190 0 0 1 251.7,304.4" fill="none" stroke="#8f8678" stroke-width="1.6" marker-end="url(#head)"/>
<path d="M272.6,240.1 A190,190 0 0 1 406.2,143.0" fill="none" stroke="#8f8678" stroke-width="1.6" marker-end="url(#head)"/>
<circle cx="440.0" cy="140.0" r="20" fill="#e9a35a"/>
<text x="440.0" y="46.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#f3ead8" letter-spacing="0.5">Life</text>
<text x="440.0" y="68.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#bdb3a2">the still life</text>
<text x="440.0" y="87.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#bdb3a2">in the room</text>
<circle cx="620.7" cy="271.3" r="20" fill="url(#release)"/>
<text x="664.4" y="247.1" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#f3ead8" letter-spacing="0.5">Release</text>
<text x="664.4" y="269.1" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#bdb3a2">the room opens into space,</text>
<text x="664.4" y="288.1" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#bdb3a2">the objects float</text>
<circle cx="562.7" cy="483.7" r="1.4" fill="#ffffff" opacity="0.55"/><circle cx="565.6" cy="490.4" r="2.0" fill="#ffffff" opacity="0.67"/><circle cx="564.1" cy="499.3" r="2.6" fill="#ffffff" opacity="0.79"/><circle cx="554.6" cy="496.6" r="1.4" fill="#ffffff" opacity="0.91"/><circle cx="547.7" cy="501.0" r="2.0" fill="#ffffff" opacity="0.55"/><circle cx="544.8" cy="492.3" r="2.6" fill="#ffffff" opacity="0.67"/><circle cx="537.7" cy="490.4" r="1.4" fill="#ffffff" opacity="0.79"/><circle cx="531.7" cy="483.7" r="2.0" fill="#ffffff" opacity="0.91"/><circle cx="539.7" cy="478.0" r="2.6" fill="#ffffff" opacity="0.55"/><circle cx="540.6" cy="469.8" r="1.4" fill="#ffffff" opacity="0.67"/><circle cx="549.2" cy="473.0" r="2.0" fill="#ffffff" opacity="0.79"/><circle cx="555.1" cy="468.6" r="2.6" fill="#ffffff" opacity="0.91"/><circle cx="564.1" cy="468.1" r="1.4" fill="#ffffff" opacity="0.55"/><circle cx="563.6" cy="478.0" r="2.0" fill="#ffffff" opacity="0.67"/><circle cx="551.7" cy="483.7" r="4" fill="#ffffff" opacity="0.9"/>
<text x="578.7" y="526.9" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#f3ead8" letter-spacing="0.5">Dissolution</text>
<text x="578.7" y="548.9" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#bdb3a2">the objects dissolve</text>
<text x="578.7" y="567.9" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#bdb3a2">into particles</text>
<circle cx="328.3" cy="483.7" r="20" fill="none" stroke="#bdb3a2" stroke-width="1.4"/>
<text x="301.3" y="526.9" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#f3ead8" letter-spacing="0.5">Stillness</text>
<text x="301.3" y="548.9" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#bdb3a2">empty space</text>
<circle cx="259.3" cy="271.3" r="38.0" fill="url(#glow)"/><circle cx="259.3" cy="271.3" r="14.0" fill="#e9a35a"/>
<text x="215.6" y="247.1" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#f3ead8" letter-spacing="0.5">Rebirth</text>
<text x="215.6" y="269.1" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#bdb3a2">the room returns</text>
<text x="215.6" y="288.1" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#bdb3a2">with new objects</text>
<text x="440" y="326" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#f3ead8" letter-spacing="3">Unstil Life</text>
<text x="440" y="352" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#bdb3a2">the cycle of life</text>
</svg>
